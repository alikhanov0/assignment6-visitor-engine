name: Java 17 verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run all tests
        run: mvn -B clean verify
      - name: Run inspection demo
        run: java -jar target/smart-code-inspection-1.0.0.jar
